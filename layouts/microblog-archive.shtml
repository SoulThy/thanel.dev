<extend template="base.shtml">
<head id="head">
	<style>
		.date {
			font-size: 0.9em;
		}
		
		.title h3{
			margin-top: 0;
		}
	</style>
</head>
<body id="body">
	<h1 class="title" :text="$page.title.prefix('└> ')"></h1>
	<div :html="$page.content()"></div>
	<div>
		<div :loop="$page.subpages()">
			<a class="title" href="$loop.it.link()">
				<h3 :text="$loop.it.title"></h3>
			</a>
		</div>
	</div>
</body>

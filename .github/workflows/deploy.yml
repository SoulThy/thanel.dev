name: Deploy Blog to AWS

on:
  push:
    branches: [main]

env:
  BUCKET_NAME: "thanel-dev-blog-bucket"
  AWS_REGION: "eu-north-1"
  DISTRIBUTION_ID: "E17MEWX0D97KUE"
  GITHUB_ACTIONS_ROLE_ARN: "arn:aws:iam::275459308866:role/thanel-dev-blog-github-actions-deploy-role"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zine
        uses: kristoff-it/setup-zine@v1
        with:
          version: v0.14.0

      - name: Release
        run: zine release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync files to S3
        run: aws s3 sync ./public s3://${{ env.BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ env.DISTRIBUTION_ID }} \
          --paths "/*"
